<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 46 260 324" width="260" height="324" role="img" aria-label="Neonna con lentes de sol, deslumbrada por el modo claro">
  <!--
    NEONNA — variante lentes de sol (modo claro)
    Basada en neonna-base.svg: agrega #lentes, #destellos y #gota; oculta #hud-grupo y los ojos; cambia #boca.
    Para crear una variante: copia este archivo y cambia los colores del bloque PALETA
    o reemplaza/oculta grupos por id:
      #coleta  #pelo-atras  #piernas  #brazo-izq  #cuerpo  #brazo-der
      #cuello  #cara  #boca  #ojo-izq  #ojo-der  #hud-grupo  #flequillo
      #mechon  #auriculares  #orejas  #microfono
  -->
  <defs>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="pelo-1"/>
      <stop offset="0.55" class="pelo-2"/>
      <stop offset="1" class="pelo-3"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="iris-1"/>
      <stop offset="0.5" class="iris-2"/>
      <stop offset="1" class="iris-3"/>
    </linearGradient>
    <linearGradient id="lente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="lente-1"/>
      <stop offset="1" class="lente-2"/>
    </linearGradient>
    <clipPath id="cristales">
      <path d="M146 174 Q170 167 194 174 L191 199 Q170 220 151 205 Z"/>
      <path d="M254 174 Q230 167 206 174 L209 199 Q230 220 249 205 Z"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1200" height="1200">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* ===== PALETA: cada clase es un color. Para recolorear, cambia los hex aqui ===== */
    .pelo-1 { stop-color: #1e0b36; }
    .pelo-2 { stop-color: #4c1d95; }
    .pelo-3 { stop-color: #d946ef; }
    .iris-1 { stop-color: #4a044e; }
    .iris-2 { stop-color: #c026d3; }
    .iris-3 { stop-color: #f0abfc; }

    .lente-1 { stop-color: #18181b; }
    .lente-2 { stop-color: #4c1d95; }
    .f-lente { fill: url(#lente); }
    .f-destello { fill: #fcd34d; }
    .f-gota { fill: #a5f3fc; }

    .f-pelo { fill: url(#pelo); }
    .f-piel { fill: #ffe4ef; }
    .f-piel-sombra { fill: #f5c6dc; }
    .f-rubor { fill: #f472b6; opacity: 0.4; }
    .f-ropa { fill: #18181b; }
    .f-ropa-2 { fill: #27272a; }
    .f-interior { fill: #2e1065; }
    .f-neon { fill: #d946ef; }
    .f-acento { fill: #67e8f9; }
    .f-linea { fill: #1e0b36; }
    .f-blanco { fill: #fff; }
    .f-iris { fill: url(#iris); }

    .s-ropa { stroke: #18181b; fill: none; stroke-linecap: round; }
    .s-neon { stroke: #d946ef; fill: none; stroke-linecap: round; }
    .s-acento { stroke: #67e8f9; fill: none; stroke-linecap: round; }
    .s-linea { stroke: #1e0b36; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .s-boca { stroke: #86198f; fill: none; stroke-linecap: round; }
    .s-metal { stroke: #3f3f46; fill: none; stroke-linecap: round; }
    .borde-neon { stroke: #d946ef; }
    .borde-metal { stroke: #3f3f46; }
    .s-brillo { stroke: #f0abfc; fill: none; stroke-linecap: round; opacity: 0.3; }

    /* ===== ANIMACIONES IDLE ===== */
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    #coleta { transform-origin: 136px 120px; animation: coleta 3s ease-in-out infinite; }
    @keyframes coleta { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-5deg); } }

    .ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 4.2s infinite; }
    @keyframes parpadeo { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

    #hud { transform-box: fill-box; transform-origin: center; animation: girar 6s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    .led { animation: led 2s ease-in-out infinite; }
    .led2 { animation: led 2s ease-in-out infinite; animation-delay: -1s; }
    @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* reflejo que cruza los cristales */
    .reflejo { animation: reflejo 3.2s ease-in-out infinite; }
    @keyframes reflejo { 0%,55% { transform: translateX(-70px); } 85%,100% { transform: translateX(70px); } }

    /* brillitos de deslumbramiento */
    .brillo { transform-box: fill-box; transform-origin: center; animation: brillo 1.6s ease-in-out infinite; }
    @keyframes brillo { 0%,100% { transform: scale(0.4) rotate(0deg); opacity: 0.2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }

    /* gota de sudor */
    #gota { animation: gota 3s ease-in infinite; }
    @keyframes gota { 0%,40% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(10px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g id="neonna" class="bob">
    <g id="coleta">
      <path class="f-pelo" d="M136 112 C84 122 70 200 84 268 C88 290 74 304 64 302 C98 304 116 254 114 212 C112 172 122 142 146 128 Z"/>
      <path class="s-brillo" stroke-width="2" d="M112 150 C96 190 92 236 96 276"/>
      <rect class="f-acento" filter="url(#glow)" x="128" y="112" width="14" height="10" rx="3" transform="rotate(-20 135 117)"/>
    </g>

    <path id="pelo-atras" class="f-pelo" d="M108 170 C100 90 160 62 200 62 C240 62 300 90 292 170 L296 250 Q280 262 262 250 L258 200 L142 200 L138 250 Q120 262 104 250 Z"/>

    <g id="piernas">
      <rect class="f-ropa-2" x="178" y="330" width="16" height="26"/>
      <rect class="f-ropa-2" x="206" y="330" width="16" height="26"/>
      <rect class="f-ropa" x="172" y="350" width="26" height="13" rx="5"/>
      <rect class="f-ropa" x="202" y="350" width="26" height="13" rx="5"/>
      <path class="s-neon" stroke-width="2" filter="url(#glow)" d="M174 362 L196 362 M204 362 L226 362"/>
    </g>

    <g id="cuerpo">
      <path class="f-ropa" d="M158 252 Q200 242 242 252 L256 330 Q200 342 144 330 Z"/>
      <path class="s-neon" stroke-width="2" filter="url(#glow)" d="M144 330 Q200 342 256 330"/>
      <path class="f-interior" d="M186 262 L200 300 L214 262 Z"/>
      <path class="s-neon" stroke-width="1.6" filter="url(#glow)" d="M200 300 L200 336"/>
      <path class="f-ropa-2 borde-neon" stroke-width="1.5" stroke-linejoin="round" d="M170 248 L200 262 L230 248 L233 264 L200 280 L167 264 Z"/>
      <rect x="160" y="290" width="22" height="12" rx="2" fill="#09090b" class="s-acento" stroke-width="1"/>
      <text class="f-acento" x="171" y="299" font-size="8" font-family="monospace" text-anchor="middle">07</text>
      <circle class="f-neon led" filter="url(#glow)" cx="228" cy="296" r="2.5"/>
    </g>

    <g id="brazo-izq">
      <path class="s-metal" stroke-width="20" d="M162 258 Q136 288 140 316"/>
      <path class="s-ropa" stroke-width="17" d="M162 258 Q136 288 140 316"/>
      <circle class="f-piel" cx="140" cy="323" r="8"/>
      <path class="s-neon" stroke-width="2.5" filter="url(#glow)" d="M132 311 L148 311"/>
    </g>

    <g id="brazo-der">
      <path class="s-metal" stroke-width="20" d="M238 258 Q264 288 260 316"/>
      <path class="s-ropa" stroke-width="17" d="M238 258 Q264 288 260 316"/>
      <circle class="f-piel" cx="260" cy="323" r="8"/>
      <path class="s-neon" stroke-width="2.5" filter="url(#glow)" d="M252 311 L268 311"/>
    </g>

    <rect id="cuello" class="f-piel-sombra" x="190" y="238" width="20" height="14"/>

    <g id="cara">
      <path class="f-piel" d="M134 175 C134 230 170 246 200 248 C230 246 266 230 266 175 C266 140 134 140 134 175 Z"/>
      <ellipse class="f-rubor" cx="158" cy="216" rx="11" ry="5"/>
      <ellipse class="f-rubor" cx="242" cy="216" rx="11" ry="5"/>
      <path id="boca" class="s-boca" stroke-width="2" d="M192 227 Q196 223 200 227 Q204 231 208 227"/>
    </g>

    <g id="ojo-izq" display="none" transform="translate(170 194)">
      <g class="ojo">
        <ellipse class="f-blanco" rx="15" ry="18"/>
        <ellipse class="f-iris" cy="2" rx="12.5" ry="16"/>
        <ellipse class="f-linea" cy="3" rx="5" ry="7.5"/>
        <circle class="f-blanco" cx="-4" cy="-5" r="4.2"/>
        <circle class="f-blanco" cx="5" cy="8" r="2" opacity="0.85"/>
        <path class="s-linea" stroke-width="4" d="M-16 -2 Q-15 -20 0 -20 Q14 -20 16 -6 L21 -11"/>
      </g>
    </g>

    <g id="ojo-der" display="none" transform="translate(230 194)">
      <g class="ojo">
        <ellipse class="f-blanco" rx="15" ry="18"/>
        <ellipse class="f-iris" cy="2" rx="12.5" ry="16"/>
        <ellipse class="f-linea" cy="3" rx="5" ry="7.5"/>
        <circle class="f-acento" cy="3" r="2"/>
        <circle class="f-blanco" cx="-4" cy="-5" r="4.2"/>
        <circle class="f-blanco" cx="5" cy="8" r="2" opacity="0.85"/>
        <path class="s-linea" stroke-width="4" d="M16 -2 Q15 -20 0 -20 Q-14 -20 -16 -6 L-21 -11"/>
      </g>
      <g id="hud-grupo" filter="url(#glow)" opacity="0.85" display="none">
        <circle id="hud" class="s-acento" r="23" stroke-width="1.4" stroke-dasharray="10 5 2 5"/>
        <path class="s-acento" stroke-width="1" d="M23 2 L40 2 L46 -6"/>
      </g>
    </g>

    <g id="flequillo">
      <path class="f-pelo" d="M112 175 C108 110 150 74 200 72 C252 72 294 110 288 178 L276 150 L268 172 L252 138 L240 165 L226 130 L212 160 L200 128 L186 162 L172 132 L160 166 L148 140 L134 172 L124 152 Z"/>
      <path class="f-pelo" d="M122 160 Q112 210 128 254 Q138 228 138 196 Z"/>
      <path class="f-pelo" d="M278 160 Q288 210 272 254 Q262 228 262 196 Z"/>
      <path id="mechon" class="s-acento" stroke-width="2.5" filter="url(#glow)" d="M126 168 Q120 206 128 244"/>
      <path class="s-brillo" stroke-width="4" d="M156 98 Q200 82 246 98"/>
    </g>

    <g id="lentes">
      <path class="s-ropa" stroke-width="3" d="M148 180 L118 178 M252 180 L282 178"/>
      <path class="f-lente borde-neon" stroke-width="2" stroke-linejoin="round" d="M146 174 Q170 167 194 174 L191 199 Q170 220 151 205 Z"/>
      <path class="f-lente borde-neon" stroke-width="2" stroke-linejoin="round" d="M254 174 Q230 167 206 174 L209 199 Q230 220 249 205 Z"/>
      <path class="s-neon" stroke-width="2.5" filter="url(#glow)" d="M194 180 Q200 175 206 180"/>
      <g clip-path="url(#cristales)">
        <g class="reflejo" fill="#fff" opacity="0.55">
          <path d="M168 162 L178 170 L158 216 L148 216 Z"/>
          <path d="M184 162 L188 170 L168 216 L164 216 Z"/>
          <path d="M228 162 L238 170 L218 216 L208 216 Z"/>
          <path d="M244 162 L248 170 L228 216 L224 216 Z"/>
        </g>
      </g>
    </g>

    <g id="destellos" class="f-destello" filter="url(#glow)">
      <path class="brillo" d="M146 172 L148 178 L154 180 L148 182 L146 188 L144 182 L138 180 L144 178 Z"/>
      <path class="brillo" style="animation-delay:-0.8s" d="M256 168 L257.5 173 L262 174.5 L257.5 176 L256 181 L254.5 176 L250 174.5 L254.5 173 Z"/>
      <path class="brillo" style="animation-delay:-0.4s" d="M200 196 L201 199 L204 200 L201 201 L200 204 L199 201 L196 200 L199 199 Z"/>
    </g>

    <path id="gota" class="f-gota" d="M256 206 Q262 214 259 218 Q256 221 253 218 Q250 214 256 206 Z"/>

    <g id="auriculares">
      <path class="s-ropa" stroke-width="9" d="M112 176 C108 96 292 96 288 176"/>
      <path class="s-neon" stroke-width="1.3" opacity="0.8" filter="url(#glow)" d="M118 150 C122 108 278 108 282 150"/>
      <g id="orejas" stroke-width="1.6" stroke-linejoin="round">
        <path class="f-ropa borde-neon" d="M128 114 L132 56 L174 88 Z"/>
        <path class="f-neon led" opacity="0.7" filter="url(#glow)" d="M137 100 L139 72 L160 89 Z"/>
        <path class="f-ropa borde-neon" d="M272 114 L268 56 L226 88 Z"/>
        <path class="f-neon led2" opacity="0.7" filter="url(#glow)" d="M263 100 L261 72 L240 89 Z"/>
      </g>
      <rect class="f-ropa borde-metal" stroke-width="1.5" x="96" y="160" width="26" height="46" rx="12"/>
      <rect class="f-neon led" filter="url(#glow)" x="104" y="170" width="10" height="26" rx="5"/>
      <rect class="f-ropa borde-metal" stroke-width="1.5" x="278" y="160" width="26" height="46" rx="12"/>
      <rect class="f-neon led2" filter="url(#glow)" x="286" y="170" width="10" height="26" rx="5"/>
    </g>

    <g id="microfono">
      <path class="s-metal" stroke-width="3" d="M108 204 Q118 236 162 230"/>
      <circle class="f-acento led2" filter="url(#glow)" cx="165" cy="230" r="3.5"/>
    </g>
  </g>
</svg>
