<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Chica chibi cyberpunk con orejas de gato y holograma">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05020a"/>
      <stop offset="0.6" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0b36"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a044e"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="haz" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1200" height="1200">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <clipPath id="marco"><rect width="400" height="400" rx="24"/></clipPath>
  </defs>

  <style>
    /* idle: respira / flota */
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    /* glitch breve cada ~5s */
    .glitch { animation: glitch 5s steps(1) infinite; }
    @keyframes glitch {
      0%,91%,100% { transform: translate(0,0); filter: none; }
      92% { transform: translate(4px,0); filter: hue-rotate(60deg); }
      93% { transform: translate(-3px,1px); }
      94% { transform: translate(2px,0); filter: hue-rotate(-40deg); }
      95% { transform: translate(0,0); filter: none; }
    }

    /* coleta que se balancea */
    .coleta { transform-origin: 136px 120px; animation: coleta 3s ease-in-out infinite; }
    @keyframes coleta { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-5deg); } }

    /* parpadeo */
    .ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 4.2s infinite; }
    @keyframes parpadeo { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

    /* anillo HUD del ojo cibernetico */
    .hud { transform-box: fill-box; transform-origin: center; animation: girar 6s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* LEDs neon */
    .led { animation: led 2s ease-in-out infinite; }
    .led2 { animation: led 2s ease-in-out infinite; animation-delay: -1s; }
    @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* holograma */
    .holo { animation: flotar 3s ease-in-out infinite, parpadeo-holo 4s steps(1) infinite; }
    @keyframes flotar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes parpadeo-holo { 0%,70%,74%,100% { opacity: 1; } 71% { opacity: 0.3; } 73% { opacity: 0.7; } }
    .barra { transform-box: fill-box; transform-origin: left; animation: cargar 2.4s ease-in-out infinite; }
    @keyframes cargar { 0% { transform: scaleX(0.1); } 70%,100% { transform: scaleX(1); } }
    .cursor { animation: led 1s steps(1) infinite; }

    /* ventanas de la ciudad */
    .ventana { animation: led 3s steps(1) infinite; }

    /* lluvia */
    .lluvia line { animation: caer 1.1s linear infinite; }
    @keyframes caer { from { transform: translateY(-60px); } to { transform: translateY(440px); } }

    /* estrellas */
    .estrella { animation: led 2.6s ease-in-out infinite; }

    /* barra de escaneo */
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(420px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#marco)">
    <!-- cielo -->
    <rect width="400" height="400" fill="url(#cielo)"/>
    <circle class="estrella" cx="40" cy="40" r="1.2" fill="#c4b5fd"/>
    <circle class="estrella" cx="120" cy="26" r="1" fill="#f0abfc" style="animation-delay:-0.8s"/>
    <circle class="estrella" cx="260" cy="34" r="1.3" fill="#c4b5fd" style="animation-delay:-1.6s"/>
    <circle class="estrella" cx="350" cy="56" r="1" fill="#67e8f9" style="animation-delay:-0.4s"/>
    <circle class="estrella" cx="80" cy="90" r="0.9" fill="#c4b5fd" style="animation-delay:-2s"/>

    <!-- ciudad -->
    <g fill="#120a20">
      <rect x="0" y="200" width="50" height="200"/>
      <rect x="44" y="150" width="44" height="250"/>
      <rect x="86" y="236" width="40" height="164"/>
      <rect x="262" y="214" width="44" height="186"/>
      <rect x="300" y="168" width="46" height="232"/>
      <rect x="342" y="118" width="58" height="282"/>
      <rect x="124" y="276" width="44" height="124" fill="#0e0718"/>
      <rect x="232" y="258" width="32" height="142" fill="#0e0718"/>
    </g>
    <rect x="356" y="96" width="2" height="22" fill="#3f3f46"/>
    <circle class="led" cx="357" cy="95" r="2.5" fill="#f43f5e" filter="url(#glow)"/>

    <!-- letrero vertical 電脳 -->
    <g filter="url(#glow)">
      <rect x="12" y="214" width="22" height="54" rx="3" fill="#18181b" stroke="#f472b6" stroke-width="1.5"/>
      <text x="23" y="236" font-size="14" font-family="sans-serif" fill="#f472b6" text-anchor="middle">電</text>
      <text x="23" y="258" font-size="14" font-family="sans-serif" fill="#f472b6" text-anchor="middle">脳</text>
    </g>
    <!-- letrero BZ -->
    <g class="led2" filter="url(#glow)">
      <rect x="352" y="140" width="36" height="16" rx="2" fill="#18181b" stroke="#67e8f9" stroke-width="1.2"/>
      <text x="370" y="152" font-size="10" font-family="monospace" fill="#67e8f9" text-anchor="middle">BZ</text>
    </g>

    <!-- ventanas -->
    <g>
      <rect class="ventana" x="52" y="166" width="5" height="7" fill="#d946ef"/>
      <rect x="64" y="166" width="5" height="7" fill="#8b5cf6"/>
      <rect class="ventana" x="52" y="184" width="5" height="7" fill="#8b5cf6" style="animation-delay:-1.4s"/>
      <rect x="76" y="184" width="5" height="7" fill="#67e8f9" opacity="0.7"/>
      <rect x="64" y="202" width="5" height="7" fill="#d946ef" opacity="0.6"/>
      <rect class="ventana" x="94" y="250" width="5" height="7" fill="#67e8f9" style="animation-delay:-0.7s"/>
      <rect x="108" y="268" width="5" height="7" fill="#d946ef" opacity="0.6"/>
      <rect x="310" y="184" width="5" height="7" fill="#d946ef"/>
      <rect class="ventana" x="324" y="184" width="5" height="7" fill="#8b5cf6" style="animation-delay:-2s"/>
      <rect x="310" y="202" width="5" height="7" fill="#67e8f9" opacity="0.6"/>
      <rect x="352" y="176" width="5" height="7" fill="#8b5cf6"/>
      <rect class="ventana" x="366" y="194" width="5" height="7" fill="#d946ef" style="animation-delay:-0.5s"/>
      <rect x="380" y="212" width="5" height="7" fill="#67e8f9" opacity="0.7"/>
      <rect x="270" y="230" width="5" height="7" fill="#8b5cf6" opacity="0.7"/>
    </g>

    <!-- halo detras de la chica -->
    <circle cx="200" cy="200" r="150" fill="url(#halo)"/>

    <!-- lluvia -->
    <g class="lluvia" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
      <line x1="20" y1="0" x2="16" y2="16" stroke="#67e8f9"/>
      <line x1="70" y1="0" x2="66" y2="16" stroke="#c4b5fd" style="animation-delay:-0.3s"/>
      <line x1="110" y1="0" x2="106" y2="16" stroke="#67e8f9" style="animation-delay:-0.7s"/>
      <line x1="150" y1="0" x2="146" y2="16" stroke="#c4b5fd" style="animation-delay:-0.15s"/>
      <line x1="190" y1="0" x2="186" y2="16" stroke="#67e8f9" style="animation-delay:-0.9s"/>
      <line x1="230" y1="0" x2="226" y2="16" stroke="#c4b5fd" style="animation-delay:-0.5s"/>
      <line x1="270" y1="0" x2="266" y2="16" stroke="#67e8f9" style="animation-delay:-0.2s"/>
      <line x1="310" y1="0" x2="306" y2="16" stroke="#c4b5fd" style="animation-delay:-0.8s"/>
      <line x1="350" y1="0" x2="346" y2="16" stroke="#67e8f9" style="animation-delay:-0.45s"/>
      <line x1="390" y1="0" x2="386" y2="16" stroke="#c4b5fd" style="animation-delay:-1s"/>
      <line x1="45" y1="0" x2="41" y2="16" stroke="#c4b5fd" style="animation-delay:-0.6s"/>
      <line x1="330" y1="0" x2="326" y2="16" stroke="#67e8f9" style="animation-delay:-0.05s"/>
    </g>

    <!-- suelo neon -->
    <rect x="0" y="366" width="400" height="34" fill="#09090b"/>
    <line x1="0" y1="366" x2="400" y2="366" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="200" cy="368" rx="60" ry="5" fill="#d946ef" opacity="0.25"/>

    <!-- ===================== CHICA ===================== -->
    <g class="glitch">
      <g class="bob">
        <!-- coleta (detras) -->
        <g class="coleta">
          <path d="M136 112 C84 122 70 200 84 268 C88 290 74 304 64 302 C98 304 116 254 114 212 C112 172 122 142 146 128 Z" fill="url(#pelo)"/>
          <path d="M112 150 C96 190 92 236 96 276" stroke="#c4b5fd" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round"/>
          <rect x="128" y="112" width="14" height="10" rx="3" fill="#67e8f9" filter="url(#glow)" transform="rotate(-20 135 117)"/>
        </g>

        <!-- pelo de atras -->
        <path d="M108 170 C100 90 160 62 200 62 C240 62 300 90 292 170 L296 250 Q280 262 262 250 L258 200 L142 200 L138 250 Q120 262 104 250 Z" fill="url(#pelo)"/>

        <!-- piernas y botas -->
        <rect x="178" y="330" width="16" height="26" fill="#27272a"/>
        <rect x="206" y="330" width="16" height="26" fill="#27272a"/>
        <rect x="172" y="350" width="26" height="13" rx="5" fill="#18181b"/>
        <rect x="202" y="350" width="26" height="13" rx="5" fill="#18181b"/>
        <line x1="174" y1="362" x2="196" y2="362" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>
        <line x1="204" y1="362" x2="226" y2="362" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>

        <!-- brazo izquierdo (abajo) -->
        <path d="M162 260 Q140 290 146 316" stroke="#18181b" stroke-width="18" fill="none" stroke-linecap="round"/>
        <circle cx="147" cy="322" r="8" fill="#ffe4ef"/>
        <path d="M139 314 L155 314" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

        <!-- chaqueta -->
        <path d="M158 252 Q200 242 242 252 L256 330 Q200 342 144 330 Z" fill="#18181b"/>
        <path d="M144 330 Q200 342 256 330" stroke="#d946ef" stroke-width="2" fill="none" filter="url(#glow)"/>
        <path d="M186 262 L200 300 L214 262 Z" fill="#2e1065"/>
        <line x1="200" y1="300" x2="200" y2="336" stroke="#d946ef" stroke-width="1.6" filter="url(#glow)"/>
        <path d="M170 248 L200 262 L230 248 L233 264 L200 280 L167 264 Z" fill="#27272a" stroke="#d946ef" stroke-width="1.5" stroke-linejoin="round"/>
        <rect x="160" y="290" width="22" height="12" rx="2" fill="#09090b" stroke="#67e8f9" stroke-width="1"/>
        <text x="171" y="299" font-size="8" font-family="monospace" fill="#67e8f9" text-anchor="middle">07</text>
        <circle class="led" cx="228" cy="296" r="2.5" fill="#d946ef" filter="url(#glow)"/>

        <!-- brazo derecho (levantado hacia el holograma) -->
        <path d="M238 258 Q266 284 284 270" stroke="#18181b" stroke-width="18" fill="none" stroke-linecap="round"/>
        <path d="M276 262 L280 278" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
        <circle cx="290" cy="266" r="8" fill="#ffe4ef"/>

        <!-- cuello -->
        <rect x="190" y="238" width="20" height="14" fill="#f5c6dc"/>

        <!-- cara -->
        <path d="M134 175 C134 230 170 246 200 248 C230 246 266 230 266 175 C266 140 134 140 134 175 Z" fill="#ffe4ef"/>
        <ellipse cx="158" cy="216" rx="11" ry="5" fill="#f472b6" opacity="0.4"/>
        <ellipse cx="242" cy="216" rx="11" ry="5" fill="#f472b6" opacity="0.4"/>
        <path d="M193 224 Q196.5 229 200 225 Q203.5 229 207 224" stroke="#86198f" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- ojo izquierdo -->
        <g transform="translate(170 194)">
          <g class="ojo">
            <ellipse rx="15" ry="18" fill="#fff"/>
            <ellipse cy="2" rx="12.5" ry="16" fill="url(#iris)"/>
            <ellipse cy="3" rx="5" ry="7.5" fill="#1e0b36"/>
            <circle cx="-4" cy="-5" r="4.2" fill="#fff"/>
            <circle cx="5" cy="8" r="2" fill="#fff" opacity="0.85"/>
            <path d="M-16 -2 Q-15 -20 0 -20 Q14 -20 16 -6 L21 -11" stroke="#1e0b36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- ojo derecho (cibernetico) -->
        <g transform="translate(230 194)">
          <g class="ojo">
            <ellipse rx="15" ry="18" fill="#fff"/>
            <ellipse cy="2" rx="12.5" ry="16" fill="url(#iris)"/>
            <ellipse cy="3" rx="5" ry="7.5" fill="#1e0b36"/>
            <circle cy="3" r="2" fill="#67e8f9"/>
            <circle cx="-4" cy="-5" r="4.2" fill="#fff"/>
            <circle cx="5" cy="8" r="2" fill="#fff" opacity="0.85"/>
            <path d="M16 -2 Q15 -20 0 -20 Q-14 -20 -16 -6 L-21 -11" stroke="#1e0b36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle class="hud" r="23" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-dasharray="10 5 2 5" opacity="0.85" filter="url(#glow)"/>
          <path d="M23 2 L40 2 L46 -6" stroke="#67e8f9" stroke-width="1" fill="none" opacity="0.8"/>
        </g>

        <!-- flequillo -->
        <path d="M112 175 C108 110 150 74 200 72 C252 72 294 110 288 178 L276 150 L268 172 L252 138 L240 165 L226 130 L212 160 L200 128 L186 162 L172 132 L160 166 L148 140 L134 172 L124 152 Z" fill="url(#pelo)"/>
        <path d="M122 160 Q112 210 128 254 Q138 228 138 196 Z" fill="url(#pelo)"/>
        <path d="M278 160 Q288 210 272 254 Q262 228 262 196 Z" fill="url(#pelo)"/>
        <path d="M126 168 Q120 206 128 244" stroke="#67e8f9" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M156 98 Q200 82 246 98" stroke="#f0abfc" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>

        <!-- auriculares con orejas de gato -->
        <path d="M112 176 C108 96 292 96 288 176" stroke="#18181b" stroke-width="9" fill="none"/>
        <path d="M118 150 C122 108 278 108 282 150" stroke="#d946ef" stroke-width="1.3" fill="none" opacity="0.8" filter="url(#glow)"/>
        <path d="M128 114 L132 56 L174 88 Z" fill="#18181b" stroke="#d946ef" stroke-width="1.6" stroke-linejoin="round"/>
        <path class="led" d="M137 100 L139 72 L160 89 Z" fill="#d946ef" opacity="0.7" filter="url(#glow)"/>
        <path d="M272 114 L268 56 L226 88 Z" fill="#18181b" stroke="#d946ef" stroke-width="1.6" stroke-linejoin="round"/>
        <path class="led2" d="M263 100 L261 72 L240 89 Z" fill="#d946ef" opacity="0.7" filter="url(#glow)"/>
        <rect x="96" y="160" width="26" height="46" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <rect class="led" x="104" y="170" width="10" height="26" rx="5" fill="#d946ef" filter="url(#glow)"/>
        <rect x="278" y="160" width="26" height="46" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
        <rect class="led2" x="286" y="170" width="10" height="26" rx="5" fill="#d946ef" filter="url(#glow)"/>
        <!-- microfono -->
        <path d="M108 204 Q118 236 162 230" stroke="#3f3f46" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle class="led2" cx="165" cy="230" r="3.5" fill="#67e8f9" filter="url(#glow)"/>
      </g>
    </g>

    <!-- holograma -->
    <g class="holo">
      <path d="M290 262 L298 240 L374 232 Z" fill="url(#haz)"/>
      <g transform="skewY(-6)" filter="url(#glow)">
        <rect x="298" y="204" width="76" height="62" rx="4" fill="#67e8f9" fill-opacity="0.08" stroke="#67e8f9" stroke-width="1.4"/>
        <text x="304" y="217" font-size="8" font-family="monospace" fill="#67e8f9">SYS//OK</text>
        <text class="cursor" x="342" y="217" font-size="8" font-family="monospace" fill="#67e8f9">_</text>
        <rect x="304" y="223" width="62" height="4" rx="2" fill="#67e8f9" opacity="0.2"/>
        <rect class="barra" x="304" y="223" width="62" height="4" rx="2" fill="#67e8f9"/>
        <rect x="304" y="232" width="40" height="2" fill="#c4b5fd" opacity="0.7"/>
        <rect x="304" y="237" width="28" height="2" fill="#c4b5fd" opacity="0.5"/>
        <rect x="304" y="242" width="34" height="2" fill="#c4b5fd" opacity="0.6"/>
        <!-- corazon pixel -->
        <g fill="#f472b6" transform="translate(350 236)">
          <rect x="0" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/>
          <rect x="-2" y="4" width="16" height="4"/>
          <rect x="0" y="8" width="12" height="4"/>
          <rect x="4" y="12" width="4" height="3"/>
        </g>
      </g>
    </g>

    <!-- scanlines + barra de escaneo -->
    <rect width="400" height="400" fill="url(#scanlines)" opacity="0.5" pointer-events="none"/>
    <rect class="scan" x="0" y="0" width="400" height="3" fill="#e879f9" opacity="0.18"/>
  </g>
  <rect x="0.75" y="0.75" width="398.5" height="398.5" rx="23.5" fill="none" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
