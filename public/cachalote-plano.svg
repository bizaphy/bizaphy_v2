<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Cachalote (plano)</title>
  <defs>
    <clipPath id="circulo">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- Fondo circular (sin borde: el halo lo pone el drop-shadow de la card) -->
  <circle cx="64" cy="64" r="60" fill="#09090b"/>

  <g clip-path="url(#circulo)">
    <!-- Olas bajo el cachalote -->
    <path d="M4 98 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#d946ef" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-6 108 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#d946ef" stroke-opacity="0.2" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Chorro del espiráculo (en la punta de la cabeza) -->
    <g fill="#f0abfc">
      <circle cx="24" cy="38" r="2.2"/>
      <circle cx="19" cy="31" r="1.8"/>
      <circle cx="29" cy="31" r="1.8"/>
      <circle cx="24" cy="26" r="1.5"/>
    </g>

    <!-- Cuerpo: cabeza cuadrada característica, cuerpo que se afina y aleta caudal -->
    <path fill="#c084fc" d="
      M18 58 C18 49 24 45 34 45 L66 45
      C80 45 90 52 98 60 L102 62
      C104 54 108 48 115 45 C114 54 112 59 108 65
      C112 70 114 75 115 84 C108 81 104 75 102 69
      L98 71 C90 77 80 81 66 81 L32 81
      C23 81 18 75 18 67 Z"/>

    <!-- Mandíbula inferior estrecha -->
    <path d="M24 75 L52 75" stroke="#581c87" stroke-width="2" stroke-linecap="round"/>

    <!-- Aleta pectoral -->
    <path fill="#a855f7" d="M50 79 C49 86 45 90 39 91 C42 87 44 83 44 79 Z"/>

    <!-- Arrugas del lomo -->
    <g fill="none" stroke="#581c87" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
      <path d="M72 52 q3 3 0 6"/>
      <path d="M79 55 q3 3 0 6"/>
      <path d="M86 59 q2.5 2.5 0 5"/>
    </g>

    <!-- Ojo -->
    <circle cx="56" cy="66" r="2.4" fill="#09090b"/>
    <circle cx="56.8" cy="65.2" r="0.8" fill="#f5f5f5"/>
  </g>
</svg>
